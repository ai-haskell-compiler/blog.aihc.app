<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>GHC not required: AIHC bootstraps from a C compiler</title>
<desc>A C compiler compiles a Haskell interpreter of 19,464 lines of C99. The interpreter runs AIHC from source, and that AIHC builds a native AIHC. The result is byte for byte identical to an AIHC built by a native AIHC.</desc>
<rect width="1200" height="630" fill="#faf8f3"/>
<rect y="622" width="1200" height="8" fill="#5e5086"/>
<g transform="translate(60 44)"><rect width="58" height="58" rx="13" fill="#5e5086"/><g transform="translate(7 7) scale(.44)"><defs><clipPath id="card-mark"><polygon points="18,18 62,18 40,88"/></clipPath></defs>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 54 Q40 36 56 54" clip-path="url(#card-mark)" stroke-linecap="butt"/>
    <path d="M18 18 L40 88 L62 18"/><path d="M64 88 L79.1 40"/>
    <circle cx="86" cy="18" r="6" fill="#fff" stroke="none"/>
  </g></g></g>
<g font-family="Inter Variable, Inter, sans-serif">
  <text x="134" y="68" font-size="21" font-weight="600" fill="#1d1a17">AI Haskell Compiler</text>
  <text x="134" y="94" font-size="16" fill="#6b655d">BOOTSTRAPPING FROM SOURCE</text>
  <text x="1140" y="78" font-size="19" text-anchor="end" fill="#5e5086">aihc.app</text>
  <text x="1140" y="592" font-size="17" text-anchor="end" fill="#5e5086">Typed by robots, designed by a human.</text>
</g>
<text x="60" y="176" font-family="Newsreader Variable, Newsreader, serif" font-size="64" letter-spacing="-1" fill="#1d1a17">GHC not required.</text>

    <rect x="60" y="250" width="200" height="120" rx="18" fill="#ffffff" stroke="#e6e0d6" stroke-width="3"/>
    <text x="160" y="305" font-family="Newsreader Variable, Newsreader, serif" font-size="38" text-anchor="middle" fill="#1d1a17">cc</text>
    <text x="160" y="342" font-family="Inter Variable, Inter, sans-serif" font-size="17" text-anchor="middle" fill="#6b655d">buildable from a seed</text>
    <line x1="260" x2="330" y1="310" y2="310" stroke="#6b655d" stroke-width="3"/>
    <polygon points="330,310 318,303 318,317" fill="#6b655d"/>
    <text x="295" y="296" font-family="Inter Variable, Inter, sans-serif" font-size="14" text-anchor="middle" fill="#6b655d">compiles</text>

    <rect x="330" y="250" width="250" height="120" rx="18" fill="#ffffff" stroke="#e6e0d6" stroke-width="3"/>
    <text x="455" y="305" font-family="Newsreader Variable, Newsreader, serif" font-size="38" text-anchor="middle" fill="#1d1a17">Interpreter</text>
    <text x="455" y="342" font-family="Inter Variable, Inter, sans-serif" font-size="17" text-anchor="middle" fill="#6b655d">19,464 lines of C</text>
    <line x1="580" x2="650" y1="310" y2="310" stroke="#6b655d" stroke-width="3"/>
    <polygon points="650,310 638,303 638,317" fill="#6b655d"/>
    <text x="615" y="296" font-family="Inter Variable, Inter, sans-serif" font-size="14" text-anchor="middle" fill="#6b655d">runs</text>

    <rect x="650" y="250" width="200" height="120" rx="18" fill="#efeaf7" stroke="#5e5086" stroke-width="3"/>
    <text x="750" y="305" font-family="Newsreader Variable, Newsreader, serif" font-size="38" text-anchor="middle" fill="#5e5086">AIHC</text>
    <text x="750" y="342" font-family="Inter Variable, Inter, sans-serif" font-size="17" text-anchor="middle" fill="#6b655d">from source</text>
    <line x1="850" x2="920" y1="310" y2="310" stroke="#6b655d" stroke-width="3"/>
    <polygon points="920,310 908,303 908,317" fill="#6b655d"/>
    <text x="885" y="296" font-family="Inter Variable, Inter, sans-serif" font-size="14" text-anchor="middle" fill="#6b655d">builds</text>

    <rect x="920" y="250" width="220" height="120" rx="18" fill="#efeaf7" stroke="#5e5086" stroke-width="3"/>
    <text x="1030" y="305" font-family="Newsreader Variable, Newsreader, serif" font-size="38" text-anchor="middle" fill="#5e5086">AIHC</text>
    <text x="1030" y="342" font-family="Inter Variable, Inter, sans-serif" font-size="17" text-anchor="middle" fill="#6b655d">native binary</text>
<text x="600" y="424" font-family="Inter Variable, Inter, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#5e5086">Every link is built from source. No pre-compiled executables.</text>
<text x="60" y="520" font-family="Inter Variable, Inter, sans-serif" font-size="24" fill="#1d1a17">The AIHC that comes out is <tspan font-weight="600">byte for byte identical</tspan> to one built by a native AIHC.</text>
</svg>