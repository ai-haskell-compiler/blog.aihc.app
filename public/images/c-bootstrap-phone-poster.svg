<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<title>GHC not required: an interpreter in C breaks AIHC's bootstrap loop</title>
<desc>GHC is written in Haskell and takes a GHC to build, so the only way into that loop is a pre-compiled binary. AIHC is written in Haskell too, and the first AIHC had to come out of that GHC binary. Now a C compiler, which can itself be bootstrapped from a seed of a few hundred bytes, compiles an interpreter of 19,464 lines of C. The interpreter runs AIHC from source, and that AIHC builds a native AIHC, byte for byte the same as one built by a native AIHC. GHC is not required.</desc>
<rect width="1080" height="1920" fill="#faf8f3"/>
<rect y="1908" width="1080" height="12" fill="#5e5086"/>
<g transform="translate(70 84)"><rect width="76" height="76" rx="17" fill="#5e5086"/><g transform="translate(9 9) scale(.58)"><defs><clipPath id="video-mark"><polygon points="18,18 62,18 40,88"/></clipPath></defs>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 54 Q40 36 56 54" clip-path="url(#video-mark)" stroke-linecap="butt"/>
    <path d="M18 18 L40 88 L62 18"/><path d="M64 88 L79.1 40"/>
    <circle cx="86" cy="18" r="6" fill="#fff" stroke="none"/>
  </g></g></g>
<text x="170" y="134" font-family="Inter Variable, Inter, sans-serif" font-size="32" font-weight="600" fill="#1d1a17">AI Haskell Compiler</text>
<text x="1010" y="134" font-family="Inter Variable, Inter, sans-serif" font-size="28" text-anchor="end" fill="#5e5086">blog.aihc.app</text>
<text x="70" y="318" font-family="Newsreader Variable, Newsreader, serif" font-size="112" letter-spacing="-2.5" fill="#1d1a17">GHC <tspan fill="#5e5086">not required.</tspan></text>
<text x="70" y="388" font-family="Inter Variable, Inter, sans-serif" font-size="31" fill="#6b655d">How a compiler written in Haskell gets built from source.</text>
<g opacity="0.380"><circle cx="290" cy="560" r="96" fill="#ffffff" stroke="#8a8378" stroke-width="6"/>
<polygon points="380.5,522.3 377.1,490.7 352.3,507.7" fill="#8a8378"/>
<circle cx="271.1" cy="465.9" r="11" fill="#b07a2a"/>
<text x="290" y="580" font-family="Newsreader Variable, Newsreader, serif" font-size="62" text-anchor="middle" fill="#1d1a17">GHC</text></g><g opacity="1.000"><text x="566" y="516" font-family="Inter Variable, Inter, sans-serif" font-size="33" font-weight="600" fill="#1d1a17">GHC is written in Haskell.</text><text x="566" y="560" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">It takes a GHC to build GHC.</text><text x="566" y="598" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">The only way into that loop</text><text x="566" y="636" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">is a pre-compiled binary.</text></g><g opacity="0.380"><line x1="290" x2="290" y1="666" y2="786" stroke="#6b655d" stroke-width="5" stroke-dasharray="10 10"/>
<polygon points="290,800 278,780 302,780" fill="#6b655d"/>
<text x="266" y="742" font-family="Inter Variable, Inter, sans-serif" font-size="26" text-anchor="end" fill="#6b655d">compiles</text></g><g opacity="1.000"><circle cx="290" cy="920" r="112" fill="#efeaf7" stroke="#5e5086" stroke-width="6"/>
<polygon points="393.7,873.3 390.3,841.7 365.5,858.6" fill="#5e5086"/>
<circle cx="268.0" cy="810.2" r="11" fill="#5e5086"/>
<text x="290" y="940" font-family="Newsreader Variable, Newsreader, serif" font-size="62" text-anchor="middle" fill="#5e5086">AIHC</text></g><g opacity="1.000"><text x="566" y="868" font-family="Inter Variable, Inter, sans-serif" font-size="33" font-weight="600" fill="#1d1a17">So is AIHC.</text><text x="566" y="912" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">AIHC builds AIHC, but the</text><text x="566" y="950" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">first one had to come out</text><text x="566" y="988" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">of that GHC binary.</text></g><g opacity="1.000"><rect x="90" y="1570" width="400" height="92" rx="20" fill="#ffffff" stroke="#e6e0d6" stroke-width="4"/>
<text x="290" y="1614" font-family="Newsreader Variable, Newsreader, serif" font-size="44" text-anchor="middle" fill="#1d1a17">Seed</text>
<text x="290" y="1648" font-family="Inter Variable, Inter, sans-serif" font-feature-settings="'tnum'" font-size="23" text-anchor="middle" fill="#6b655d">a few hundred bytes</text></g><g opacity="1.000"><line x1="290" x2="290" y1="1564" y2="1510" stroke="#6b655d" stroke-width="5"/>
<polygon points="290,1496 278,1516 302,1516" fill="#6b655d"/>
<text x="314" y="1539" font-family="Inter Variable, Inter, sans-serif" font-size="26" text-anchor="start" fill="#6b655d">bootstraps</text><rect x="90" y="1390" width="400" height="100" rx="20" fill="#ffffff" stroke="#e6e0d6" stroke-width="4"/>
<text x="290" y="1438" font-family="Newsreader Variable, Newsreader, serif" font-size="44" text-anchor="middle" fill="#1d1a17">C compiler</text>
<text x="290" y="1472" font-family="Inter Variable, Inter, sans-serif" font-feature-settings="'tnum'" font-size="23" text-anchor="middle" fill="#6b655d">built from source</text></g><g opacity="1.000"><text x="566" y="1452" font-family="Inter Variable, Inter, sans-serif" font-size="33" font-weight="600" fill="#1d1a17">C has a way in.</text><text x="566" y="1496" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">A C compiler can be built</text><text x="566" y="1534" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">from a seed: machine code</text><text x="566" y="1572" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">small enough to read.</text></g><g opacity="1.000"><line x1="290" x2="290" y1="1384" y2="1326" stroke="#6b655d" stroke-width="5"/>
<polygon points="290,1312 278,1332 302,1332" fill="#6b655d"/>
<text x="314" y="1357" font-family="Inter Variable, Inter, sans-serif" font-size="26" text-anchor="start" fill="#6b655d">compiles</text><rect x="90" y="1194" width="400" height="112" rx="20" fill="#ffffff" stroke="#e6e0d6" stroke-width="4"/>
<text x="290" y="1248" font-family="Newsreader Variable, Newsreader, serif" font-size="44" text-anchor="middle" fill="#1d1a17">Interpreter</text>
<text x="290" y="1282" font-family="Inter Variable, Inter, sans-serif" font-feature-settings="'tnum'" font-size="23" text-anchor="middle" fill="#6b655d">19,464 lines of C</text></g><g opacity="1.000"><text x="566" y="1222" font-family="Inter Variable, Inter, sans-serif" font-size="33" font-weight="600" fill="#1d1a17">A Haskell interpreter in C.</text><text x="566" y="1266" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">It runs AIHC from source,</text><text x="566" y="1304" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">and that AIHC builds</text><text x="566" y="1342" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">a native AIHC.</text></g><g opacity="1.000"><line x1="290" x2="290" y1="1188" y2="1056" stroke="#5e5086" stroke-width="5"/>
<polygon points="290,1042 278,1062 302,1062" fill="#5e5086"/>
<text x="314" y="1124" font-family="Inter Variable, Inter, sans-serif" font-size="26" text-anchor="start" fill="#5e5086">runs</text></g><g opacity="1.000"><rect x="316" y="708" width="196" height="48" rx="24" fill="#5e5086"/>
<text x="414" y="741" font-family="Inter Variable, Inter, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#ffffff">not required</text></g><g opacity="1.000"><text x="566" y="1076" font-family="Inter Variable, Inter, sans-serif" font-size="33" font-weight="600" fill="#5e5086">The loop has a new way in.</text><text x="566" y="1120" font-family="Inter Variable, Inter, sans-serif" font-size="28" fill="#6b655d">Every step is built from source.</text></g><g opacity="1.000"><line x1="70" x2="1010" y1="1716" y2="1716" stroke="#e6e0d6" stroke-width="3"/>
<circle cx="112" cy="1794" r="38" fill="#39775b"/><path d="M93 1795 l13 14 l26 -30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="1786" font-family="Inter Variable, Inter, sans-serif" font-size="36" font-weight="600" fill="#1d1a17">Byte for byte the same AIHC</text>
<text x="176" y="1828" font-family="Inter Variable, Inter, sans-serif" font-size="27" fill="#6b655d">as one built by a native AIHC, executable and all.</text></g>
</svg>