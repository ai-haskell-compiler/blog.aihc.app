<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">hackage.aihc.app architecture</title>
  <desc id="d">The visitor's browser reads server-rendered HTML and runs aihc-haddock as WebAssembly in a Web Worker. On Cloudflare, a site Worker renders pages and parses Cabal files with a Wasm parser, a Workflow Worker runs the Wasm dependency solver and verifies uploads, D1 holds the indexes and R2 holds the files. hackage.haskell.org is only a source of Cabal files, documents and source archives.</desc>
  <style>
    .bg { fill: #faf8f3; }
    .group { fill: none; stroke: #e6e0d6; stroke-width: 1.5; }
    .ext { stroke-dasharray: 6 5; }
    .box { fill: #ffffff; stroke: #e6e0d6; stroke-width: 1.5; }
    .wasm { fill: #eee9f7; stroke: #5e5086; }
    .head { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em; fill: #6b655d; }
    .head-ext { font-size: 12px; letter-spacing: 0.02em; }
    .name { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1d1a17; }
    .line { font: 400 13.5px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b655d; }
    .code { font: 500 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #46396b; }
    .edge { fill: none; stroke: #6b655d; stroke-width: 1.5; }
    .elabel { font: 500 12.5px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6b655d; }
    .ahead { fill: #6b655d; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151318; }
      .group { stroke: #2b2731; }
      .box { fill: #1d1a22; stroke: #2b2731; }
      .wasm { fill: #27223a; stroke: #b7a8e6; }
      .head, .line, .elabel { fill: #9c958b; }
      .head-ext { font-size: 12px; letter-spacing: 0.02em; }
    .name { fill: #ebe6de; }
      .code { fill: #d1c6f0; }
      .edge { stroke: #9c958b; }
      .ahead { fill: #9c958b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="540"/>

  <!-- Browser -->
  <rect class="group" x="16" y="16" width="290" height="470" rx="14"/>
  <text class="head" x="36" y="46">VISITOR'S BROWSER</text>
  <rect class="box" x="36" y="66" width="250" height="96" rx="10"/>
  <text class="name" x="52" y="94">Reader</text>
  <text class="line" x="52" y="118">Server-rendered HTML</text>
  <text class="line" x="52" y="140">Works without JavaScript</text>
  <rect class="box wasm" x="36" y="190" width="250" height="158" rx="10"/>
  <text class="name" x="52" y="218">Documentation builder</text>
  <text class="line" x="52" y="242">Web Worker, in-memory filesystem</text>
  <text class="code" x="52" y="270">aihc-haddock.wasm</text>
  <text class="line" x="52" y="292">WASI P3 component, JSPI</text>
  <text class="line" x="52" y="322">→ JSON model + Hoogle text</text>
  <rect class="box" x="36" y="376" width="250" height="90" rx="10"/>
  <text class="name" x="52" y="404">IndexedDB</text>
  <text class="line" x="52" y="428">Source archives by hash</text>
  <text class="line" x="52" y="450">Finished results</text>

  <!-- Cloudflare -->
  <rect class="group" x="346" y="16" width="370" height="470" rx="14"/>
  <text class="head" x="366" y="46">CLOUDFLARE</text>
  <rect class="box wasm" x="366" y="66" width="330" height="124" rx="10"/>
  <text class="name" x="382" y="94">Site Worker</text>
  <text class="line" x="382" y="118">Renders pages, READMEs, docs HTML</text>
  <text class="line" x="382" y="140">Search, import, upload tickets</text>
  <text class="code" x="382" y="170">aihc-cabal-syntax → parser.wasm</text>
  <rect class="box wasm" x="366" y="230" width="330" height="110" rx="10"/>
  <text class="name" x="382" y="258">Workflow Worker</text>
  <text class="code" x="382" y="286">planner.wasm</text>
  <text class="line" x="490" y="286">dependency solver</text>
  <text class="code" x="382" y="314">aihc-haddock.wasm</text>
  <text class="line" x="530" y="314">rebuilds uploads</text>
  <rect class="box" x="366" y="376" width="155" height="90" rx="10"/>
  <text class="name" x="382" y="404">D1</text>
  <text class="line" x="382" y="428">Versions, indexes</text>
  <text class="line" x="382" y="450">Jobs, results</text>
  <rect class="box" x="541" y="376" width="155" height="90" rx="10"/>
  <text class="name" x="557" y="404">R2</text>
  <text class="line" x="557" y="428">Cabal files, docs</text>
  <text class="line" x="557" y="450">Archives, models</text>

  <!-- Hackage -->
  <rect class="group ext" x="756" y="16" width="188" height="470" rx="14"/>
  <text class="head head-ext" x="776" y="46">hackage.haskell.org</text>
  <rect class="box" x="772" y="150" width="156" height="140" rx="10"/>
  <text class="name" x="788" y="178">Upstream</text>
  <text class="line" x="788" y="202">.cabal revisions</text>
  <text class="line" x="788" y="224">README, changelog</text>
  <text class="line" x="788" y="246">Source archives</text>
  <text class="line" x="788" y="270">Fetched on demand</text>

  <!-- Edges -->
  <path class="edge" d="M286 104 H366" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="elabel" x="304" y="96">HTML</text>
  <path class="edge" d="M286 230 C326 230 326 172 366 172" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="elabel" x="296" y="258">plan,</text>
  <text class="elabel" x="296" y="274">sources,</text>
  <text class="elabel" x="296" y="290">upload</text>
  <path class="edge" d="M531 190 V230" marker-end="url(#a)"/>
  <text class="elabel" x="539" y="215">start job</text>
  <path class="edge" d="M443 340 V376" marker-end="url(#a)"/>
  <path class="edge" d="M618 340 V376" marker-end="url(#a)"/>
  <path class="edge" d="M772 190 C736 190 736 128 696 128" marker-end="url(#a)"/>
  <text class="elabel" x="704" y="112">import</text>
  <path class="edge" d="M772 250 C736 250 736 285 696 285" marker-end="url(#a)"/>
  <text class="elabel" x="704" y="306">plan inputs</text>

  <!-- Legend -->
  <rect class="box wasm" x="16" y="508" width="18" height="18" rx="4"/>
  <text class="line" x="44" y="522">Haskell compiled to WebAssembly by AIHC</text>
</svg>
