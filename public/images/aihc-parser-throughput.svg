<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
      <title>aihc-parser versus GHC: Stackage parsing throughput</title>
      <desc>Relative parsing throughput: aihc-parser 1.89x, GHC (ghc-lib-parser) 1.00x.</desc>
      <rect width="1600" height="900" fill="#faf8f3"/>
      <rect y="890" width="1600" height="10" fill="#5e5086"/>
      <g transform="translate(80 62)"><rect width="78" height="78" rx="18" fill="#5e5086"/><g transform="translate(9 9) scale(.6)"><defs><clipPath id="mark-inner"><polygon points="18,18 62,18 40,88"/></clipPath></defs>
    <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 54 Q40 36 56 54" clip-path="url(#mark-inner)" stroke-linecap="butt"/>
      <path d="M18 18 L40 88 L62 18"/><path d="M64 88 L79.1 40"/>
      <circle cx="86" cy="18" r="6" fill="#fff" stroke="none"/>
    </g></g></g>
      <g font-family="Inter Variable, Inter, sans-serif" fill="#1d1a17">
        <text x="180" y="94" font-size="28" font-weight="600">AI Haskell Compiler</text>
        <text x="180" y="129" font-size="22" fill="#6b655d">PERFORMANCE NOTES / 02</text>
        <text x="1520" y="106" font-size="25" text-anchor="end" fill="#5e5086">aihc.app</text>
        <text x="80" y="231" font-family="Newsreader Variable, Newsreader, serif" font-size="76" letter-spacing="-1">Parsing is only the start.</text>
        <text x="82" y="282" font-size="28" fill="#6b655d">Haskell parsing · Stackage LTS 24.36 · 55,698 files</text>
        <rect x="1220" y="179" width="300" height="112" rx="18" fill="#eee9f7"/>
        <text x="1370" y="234" text-anchor="middle" font-size="43" font-weight="600" fill="#5e5086">1.9×</text>
        <text x="1370" y="268" text-anchor="middle" font-size="21" fill="#5e5086">parsing throughput</text>
        <text x="340" y="360" font-size="23" fill="#6b655d">Parsing throughput relative to GHC · higher is better</text>
        <line x1="340" x2="340" y1="390" y2="613" stroke="#e6e0d6" stroke-width="2"/>
          <text x="340" y="653" text-anchor="middle" font-size="22" fill="#6b655d">0.0</text><line x1="565" x2="565" y1="390" y2="613" stroke="#e6e0d6" stroke-width="2"/>
          <text x="565" y="653" text-anchor="middle" font-size="22" fill="#6b655d">0.5</text><line x1="790" x2="790" y1="390" y2="613" stroke="#e6e0d6" stroke-width="2"/>
          <text x="790" y="653" text-anchor="middle" font-size="22" fill="#6b655d">1.0</text><line x1="1015" x2="1015" y1="390" y2="613" stroke="#e6e0d6" stroke-width="2"/>
          <text x="1015" y="653" text-anchor="middle" font-size="22" fill="#6b655d">1.5</text><line x1="1240" x2="1240" y1="390" y2="613" stroke="#e6e0d6" stroke-width="2"/>
          <text x="1240" y="653" text-anchor="middle" font-size="22" fill="#6b655d">2.0</text>
        <text x="304" y="446" text-anchor="end" font-size="34" font-weight="600" fill="#5e5086">aihc-parser</text>
          <rect x="340" y="400" width="849.0566037735848" height="72" rx="8" fill="#5e5086"/>
          <text x="1211.0566037735848" y="448" font-size="40" font-weight="600">1.89×</text><text x="304" y="572" text-anchor="end" font-size="34" font-weight="600" fill="#6b655d">GHC</text>
          <rect x="340" y="526" width="450" height="72" rx="8" fill="#b0a69b"/>
          <text x="812" y="574" font-size="40" font-weight="600">1.00×</text>
        <line x1="80" x2="1520" y1="727" y2="727" stroke="#e6e0d6" stroke-width="2"/>
        <text x="80" y="763" font-size="24" fill="#6b655d">Nearly twice the throughput. Still only one stage.</text>
        <text x="80" y="800" font-size="22" fill="#6b655d">Source: aihc-parser / BENCHMARKS.md</text>
        <text x="1520" y="865" font-size="22" text-anchor="end" fill="#5e5086">Fast compilation needs fast type-checking, too.</text>
      </g>
    </svg>